[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "Rigorous comparison of LR vs GB for churn prediction"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
