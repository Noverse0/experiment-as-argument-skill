[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "Customer churn prediction experiment: gradient boosting vs logistic regression"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
