[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "ML experiment: gradient boosting vs logistic regression for churn prediction"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3",
    "scikit-learn>=0.24",
    "numpy>=1.20",
    "pytest>=6.0",
]
