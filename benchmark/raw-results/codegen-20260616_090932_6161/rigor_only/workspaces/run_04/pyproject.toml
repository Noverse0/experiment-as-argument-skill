[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "ML experiment: LogisticRegression vs GradientBoostingClassifier for churn prediction"
requires-python = ">=3.8"

dependencies = [
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
