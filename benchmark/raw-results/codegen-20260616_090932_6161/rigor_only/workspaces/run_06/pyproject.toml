[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "Experiment: Gradient Boosting vs Logistic Regression for Churn Prediction"
requires-python = ">=3.8"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
