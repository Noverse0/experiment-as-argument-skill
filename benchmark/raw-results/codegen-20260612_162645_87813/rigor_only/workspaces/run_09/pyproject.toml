[project]
name = "churn-experiment"
version = "0.1.0"
description = "Leak-free, time-respecting comparison of LogisticRegression vs GradientBoosting for churn prediction"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
