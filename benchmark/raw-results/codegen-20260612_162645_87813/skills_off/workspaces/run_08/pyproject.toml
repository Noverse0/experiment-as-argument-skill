[project]
name = "churn-experiment"
version = "0.1.0"
description = "Leak-free, time-respecting comparison of GradientBoosting vs LogisticRegression for churn prediction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
