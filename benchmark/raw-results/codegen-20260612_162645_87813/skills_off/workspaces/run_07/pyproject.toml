[project]
name = "churn-experiment"
version = "0.1.0"
description = "LogisticRegression vs GradientBoostingClassifier for churn prediction, with leakage controls."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
