[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "Churn prediction experiment: Gradient Boosting vs Logistic Regression"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.0",
    "pandas>=1.3",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]
