[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "Gradient boosting vs logistic regression for churn prediction"
requires-python = ">=3.8"
dependencies = [
    "scikit-learn>=1.0",
    "pandas>=1.3",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
