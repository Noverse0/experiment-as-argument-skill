[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "0.1.0"
description = "Rigorous ML experiment: LogisticRegression vs GradientBoosting for churn prediction"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.19.0",
    "scikit-learn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
