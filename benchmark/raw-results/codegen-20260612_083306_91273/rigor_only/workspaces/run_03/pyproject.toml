[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-experiment"
version = "1.0.0"
description = "ML experiment comparing LogisticRegression vs GradientBoosting for churn prediction"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
]
