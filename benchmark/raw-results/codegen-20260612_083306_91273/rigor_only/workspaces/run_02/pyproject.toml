[project]
name = "churn-prediction-experiment"
version = "0.1.0"
description = "ML experiment: Gradient Boosting vs Logistic Regression for customer churn prediction"
requires-python = ">=3.10"

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
